# Maps COVA export column headers to the fields src/parse_cova.py needs.
# Copy to column_map.yaml and edit once you have a real export to check headers against -
# COVA lets you customize which columns appear, so these lists cover common variants;
# add whatever your export actually says as the first match wins.

sales_export:
  product: ["Product", "Product Name", "Item", "Item Name"]
  sku: ["SKU", "Product SKU", "Item SKU"]
  category: ["Category", "Product Category", "Master Category"]
  quantity_sold: ["Qty Sold", "Quantity Sold", "Units Sold", "Qty"]
  date: ["Date", "Sale Date", "Transaction Date"]

inventory_export:
  product: ["Product", "Product Name", "Item", "Item Name"]
  sku: ["SKU", "Product SKU", "Item SKU"]
  category: ["Category", "Product Category", "Master Category"]
  quantity_on_hand: ["On Hand", "Qty On Hand", "Stock On Hand", "Available", "Available Qty"]
